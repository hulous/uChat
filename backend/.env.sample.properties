POSTGRES_DB=uchat_chat_app
POSTGRES_HOST=uchat-postgres
POSTGRES_PORT=5432
POSTGRES_USER=uchat
# Local-only placeholder. Replace with a unique password before starting Compose.
POSTGRES_PASSWORD=local-only-change-me
# Local Compose PostgreSQL does not provide TLS. Production must use verify-full.
POSTGRES_SSLMODE=disable
# Local-only placeholder. Use a high-entropy secret outside local development.
JWT_SECRET_TOKEN=local-only-replace-with-a-long-random-secret
MAIN_APP_PORT=8050
FRONTEND_URL=http://localhost:4250
