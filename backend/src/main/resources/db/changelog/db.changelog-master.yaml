databaseChangeLog:
  - changeSet:
      id: 1
      author: liquibase
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp

  - changeSet:
      id: 2
      author: liquibase
      changes:
        - createTable:
            tableName: chat_message
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conversation_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: varchar(2000)
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: chat_message
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_message_sender

  - changeSet:
      id: 3
      author: liquibase
      changes:
        - createTable:
            tableName: chat_room
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createTable:
            tableName: chat_room_member
            columns:
              - column:
                  name: room_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: integer
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: chat_room_member
            columnNames: room_id, user_id
            constraintName: pk_chat_room_member
        - addForeignKeyConstraint:
            baseTableName: chat_room_member
            baseColumnNames: room_id
            referencedTableName: chat_room
            referencedColumnNames: id
            constraintName: fk_chat_room_member_room
        - addForeignKeyConstraint:
            baseTableName: chat_room_member
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_room_member_user
        - addColumn:
            tableName: chat_message
            columns:
              - column:
                  name: room_id
                  type: uuid
        - addForeignKeyConstraint:
            baseTableName: chat_message
            baseColumnNames: room_id
            referencedTableName: chat_room
            referencedColumnNames: id
            constraintName: fk_chat_message_room

  - changeSet:
      id: 4
      author: liquibase
      changes:
        - addColumn:
            tableName: chat_room
            columns:
              - column:
                  name: owner_id
                  type: integer
        - sql:
            sql: UPDATE chat_room SET owner_id = (SELECT MIN(user_id) FROM chat_room_member WHERE room_id = chat_room.id)
        - addNotNullConstraint:
            tableName: chat_room
            columnName: owner_id
            columnDataType: integer
        - addForeignKeyConstraint:
            baseTableName: chat_room
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_room_owner
        - createTable:
            tableName: chat_room_ban
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: room_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: banned_by_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: banned_until
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: chat_room_ban
            columnNames: room_id, user_id
            constraintName: uq_chat_room_ban_room_user
        - addForeignKeyConstraint:
            baseTableName: chat_room_ban
            baseColumnNames: room_id
            referencedTableName: chat_room
            referencedColumnNames: id
            constraintName: fk_chat_room_ban_room
        - addForeignKeyConstraint:
            baseTableName: chat_room_ban
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_room_ban_user
        - addForeignKeyConstraint:
            baseTableName: chat_room_ban
            baseColumnNames: banned_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_room_ban_banned_by

  - changeSet:
      id: 5
      author: liquibase
      changes:
        - addColumn:
            tableName: chat_room
            columns:
              - column:
                  name: is_public
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false