name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and verify backend
        working-directory: backend
        run: mvn -q verify

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chrome
        run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run frontend build
        working-directory: frontend
        run: npm run build
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

  dependency-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm install && npm audit --audit-level=high
      - name: Audit E2E dependencies
        working-directory: e2e
        run: npm install && npm audit --audit-level=high
      - name: Audit Maven dependencies
        working-directory: backend
        run: mvn -q org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  e2e:
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET_TOKEN: ${{ secrets.JWT_SECRET_TOKEN }}
      MAIN_APP_PORT: ${{ vars.MAIN_APP_PORT }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate required environment
        run: bash scripts/validate-env.sh
      - name: Configure test environment
        run: |
          printf '%s\n' \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "POSTGRES_HOST=${POSTGRES_HOST}" \
            "POSTGRES_PORT=${POSTGRES_PORT}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "POSTGRES_SSLMODE=${POSTGRES_SSLMODE}" \
            "JWT_SECRET_TOKEN=$JWT_SECRET_TOKEN" \
            "MAIN_APP_PORT=${MAIN_APP_PORT}" \
            "FRONTEND_URL=${FRONTEND_URL}" \
            "BACKEND_URL=${BACKEND_URL}" > .env
      - name: Run end-to-end tests
        run: make test-e2e
      - name: Collect E2E service diagnostics
        if: ${{ failure() }}
        run: |
          printf '%s\n' \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "POSTGRES_HOST=${POSTGRES_HOST}" \
            "POSTGRES_PORT=${POSTGRES_PORT}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_SSLMODE=${POSTGRES_SSLMODE}" \
            "MAIN_APP_PORT=${MAIN_APP_PORT}" \
            "FRONTEND_URL=${FRONTEND_URL}" \
            "BACKEND_URL=${BACKEND_URL}"
          test -n "${POSTGRES_PASSWORD}" && echo "POSTGRES_PASSWORD=<present>" || echo "POSTGRES_PASSWORD=<missing>"
          test -n "${JWT_SECRET_TOKEN}" && echo "JWT_SECRET_TOKEN=<present>" || echo "JWT_SECRET_TOKEN=<missing>"
          docker compose ps -a
          docker compose logs --no-color --timestamps \
            uchat-postgres uchat-backend uchat-frontend
