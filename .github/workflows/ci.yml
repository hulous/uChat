name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and verify backend
        working-directory: backend
        run: mvn -q verify

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chrome
        run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run frontend build
        working-directory: frontend
        run: npm run build
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

  e2e:
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET_TOKEN: ${{ secrets.JWT_SECRET_TOKEN }}
      MAIN_APP_PORT: ${{ vars.MAIN_APP_PORT }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate required environment
        run: bash scripts/validate-env.sh
      - name: Configure test environment
        run: |
          printf '%s\n' \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "POSTGRES_HOST=${POSTGRES_HOST}" \
            "POSTGRES_PORT=${POSTGRES_PORT}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "POSTGRES_SSLMODE=${POSTGRES_SSLMODE}" \
            "JWT_SECRET_TOKEN=$JWT_SECRET_TOKEN" \
            "MAIN_APP_PORT=${MAIN_APP_PORT}" \
            "FRONTEND_URL=${FRONTEND_URL}" \
            "BACKEND_URL=${BACKEND_URL}" > .env
      - name: Run end-to-end tests
        run: |
          for attempt in 1 2 3 4 5; do
            if make e2e-up; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "E2E environment setup failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          make test-e2e-smoke
          make test-e2e-realtime
      - name: Collect E2E service diagnostics
        if: ${{ failure() }}
        run: |
          printf '%s\n' \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "POSTGRES_HOST=${POSTGRES_HOST}" \
            "POSTGRES_PORT=${POSTGRES_PORT}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_SSLMODE=${POSTGRES_SSLMODE}" \
            "MAIN_APP_PORT=${MAIN_APP_PORT}" \
            "FRONTEND_URL=${FRONTEND_URL}" \
            "BACKEND_URL=${BACKEND_URL}"
          test -n "${POSTGRES_PASSWORD}" && echo "POSTGRES_PASSWORD=<present>" || echo "POSTGRES_PASSWORD=<missing>"
          test -n "${JWT_SECRET_TOKEN}" && echo "JWT_SECRET_TOKEN=<present>" || echo "JWT_SECRET_TOKEN=<missing>"
          docker compose ps -a
          docker compose logs --no-color --timestamps \
            uchat-postgres uchat-backend uchat-frontend > e2e-service-logs.txt
          mkdir -p e2e-artifacts
          cp e2e-service-logs.txt e2e-artifacts/
          docker compose ps -a > e2e-artifacts/compose-ps.txt
          find e2e/test-results -type f -maxdepth 3 -print 2>/dev/null || true
      - name: Upload E2E failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/test-results/
            e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
