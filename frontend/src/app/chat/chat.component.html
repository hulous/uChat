<section aria-labelledby="chat-title">
  <header class="chat-header">
    <h1 id="chat-title">{{ "chat.title" | translate }}</h1>
    <button type="button" (click)="logout()">{{ "chat.logout" | translate }}</button>
  </header>

  <div
    class="chat-window"
    role="log"
    aria-live="polite"
    [attr.aria-label]="'chat.messages' | translate"
    tabindex="0"
  >
    @if (!isReady()) {
      <p>{{ "chat.loading" | translate }}</p>
    } @else if (messages().length) {
      @for (message of messages(); track message) {
        <article class="chat-message">
          <strong>{{ message.author }}</strong>
          <time [attr.datetime]="message.datetime">{{
            message.timestamp
          }}</time>
          <p>{{ message.text }}</p>
        </article>
      }
    } @else {
      <p>{{ "chat.empty" | translate }}</p>
    }
  </div>

  <form class="chat-form" (ngSubmit)="sendMessage()">
    <label for="messageInput">{{ "chat.message" | translate }}</label>
    <textarea
      id="messageInput"
      name="message"
      rows="3"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      (keydown.enter)="handleEnterKey($event)"
      required
      aria-required="true"
      autofocus
      [placeholder]="'chat.placeholder' | translate"
    ></textarea>

    <button type="submit" [disabled]="!draft().trim()">{{ "chat.send" | translate }}</button>
  </form>
</section>
