<section aria-labelledby="account-title">
  <header class="account-header">
    <div>
      <h1 id="account-title">{{ "account.title" | translate }}</h1>
      <p>{{ "account.intro" | translate }}</p>
    </div>
    <app-user-navigation currentPage="account" />
  </header>
  @if (isLoading()) {
    <p>{{ "account.loading" | translate }}</p>
  } @else {
    <form class="account-form" (ngSubmit)="submit()">
      <label for="accountName">{{ "auth.fields.name" | translate }}</label>
      <input id="accountName" name="name" [(ngModel)]="name" required />
      <label for="accountEmail">{{ "auth.fields.email" | translate }}</label>
      <input id="accountEmail" name="email" type="email" [(ngModel)]="email" required />
      <label for="accountPassword">{{ "account.newPassword" | translate }}</label>
      <input id="accountPassword" name="password" type="password" [(ngModel)]="password" minlength="8" />
      <p class="form-hint">{{ "account.passwordHint" | translate }}</p>
      <p role="status" aria-live="polite">{{ message() }}</p>
      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }
      <button type="submit" [disabled]="isSubmitting() || !name.trim() || !email.trim()">
        {{ isSubmitting() ? ("account.saving" | translate) : ("account.save" | translate) }}
      </button>
    </form>
  }
</section>
