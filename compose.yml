services:
  uchat-postgres:
    image: postgres:16
    container_name: uchat-postgres
    env_file: .env
    ports:
      - '5532:5432'
    volumes:
      - uchat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  uchat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uchat-backend
    depends_on:
      uchat-postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - '8050:8050'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8050/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  uchat-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uchat-frontend
    env_file: .env
    ports:
      - '4250:4200'
    depends_on:
      uchat-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4200']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  uchat-e2e:
    profiles: ['e2e']
    build:
      context: ./e2e
      dockerfile: Dockerfile
    env_file: .env
    environment:
      BASE_URL: http://uchat-frontend:4200
    volumes:
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      uchat-frontend:
        condition: service_healthy

volumes:
  uchat_db_data:
